version: 2
# Dependabot is a a code review tool that automatically checks for updates 
# in your dependencies and creates pull requests to update them.
updates:
  
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Model"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/View/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/View/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Controller"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/Controller"
    schedule:
      interval: "weekly"