info:
  name: import-items
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:3000/api/item/import-items
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - items_ejemplo.csv
        contentType: text/csv; charset=utf-8
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
